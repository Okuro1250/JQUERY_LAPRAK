<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Fullstack</title>
    <link rel="stylesheet" href="Style.css" />
    <script src="jquery.js" defer></script>
    <script src="Node.js" defer></script>
  </head>

  <body>
    <div class="Kotak1">
      <div class="header-biodata">
        <h1 id="Judul">BIODATA GWEHJ</h1>
        <button type="button" id="theme" aria-label="Ganti tema">🌙</button>
      </div>

      <div class="Kotak2">
        <div id="KotakData">
          <div class="profile_picture">
            <button type="button" id="edit_profile"></button>
            <input type="file" id="input_foto" accept="image/*" hidden />
          </div>

          <p class="data" name="NaU">Nama: Fachrur</p>
          <p class="data" id="NiU">NIM: 2511501022</p>
          <p class="data" id="PU">Prodi: Teknologi Informasi</p>
        </div>

        <div class="Kotak Input">
          <div id="InputNama">
            <p>Nama kamu</p>
            <input type="text" name="INnama" />
          </div>

          <div id="Input NIM">
            <p>NIM kamu</p>
            <input type="text" id="INnim" />
          </div>

          <div id="Input Prodi">
            <p>Prodi kamu</p>
            <input type="text" id="PIU" />
          </div>

          <div id="tombol_input2">
            <button type="button" id="AllBut">All</button>
            <button type="button" id="FontBut">Font</button>
            <button type="button" id="AnimasiBut">Animasi</button>
          </div>

          <div id="tombol_input">
            <button type="button" id="UpdateBut">Perbarui Data</button>
          </div>
          <p class="pesan" id="pesan">Data Berhasil Diubah!</p>
          <p class="pesanX" id="pesanX">Tidak Ada Data Yang Berubah</p>
        </div>
      </div>
    </div>
  </body>
</html>
